name: Gemini Autonomous Code Assistant

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "What should Gemini code or fix?"
        required: true
        default: "Add data/ directory with sample market data and README"
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  gemini-code:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[gemini]')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Determine Task Prompt
        id: get_prompt
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "PROMPT=${{ github.event.inputs.prompt }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "issues" ]; then
            echo "PROMPT=${{ github.event.issue.body }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "PROMPT=${{ github.event.comment.body }}" >> $GITHUB_ENV
          fi

      - name: Run Gemini Assistant
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_PROMPT: ${{ env.PROMPT }}
        run: python .github/scripts/gemini_assistant.py

      - name: Commit and Push Directly to Main
        run: |
          git config --global user.name "Gemini Autonomous Assistant"
          git config --global user.email "gemini-bot@google.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Gemini: $PROMPT"
            git push origin main
          else
            echo "No changes generated."
          fi
